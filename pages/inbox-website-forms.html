<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Forms Inbox — Taqwa Automobile Service Center</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('taqwa_theme'));
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/inbox-website-forms.css">
  <!-- Hold the first paint until app.js has drawn the shell (marker at the end
       of <body>), so a page change never shows a frame without the sidebar
       and header. The browser keeps the previous page on screen meanwhile.
       Chromium releases the hold as soon as app.js inserts the shell (it
       contains images) and then logs "Did not find element expected to be
       parsed" -- a harmless warning; the marker must stay AFTER the scripts,
       because placed before app.js a frame can slip out before the shell. -->
  <link rel="expect" href="#shell-drawn" blocking="render">
  <!-- The sidebar logo and the header's avatar are drawn by app.js; fetch them
       alongside the scripts so they are ready in that first frame instead of
       popping in after it. -->
  <link rel="preload" href="../assets/logo/logo-white.png" as="image">
  <link rel="preload" href="../assets/avatar/admin.webp" as="image">
</head>
<body data-page="inbox-website-forms" data-root="../">

  <div id="page-content">

    <!-- Website Forms. Filled in by js/inbox-website-forms.js from the workshop database
         (GET /api/website-forms, migration 0016). Enquiries arrive from the public website through
         POST /api/forms/submit. Nothing here is sample data. -->

    <div class="wf-head">
      <span class="wf-head__icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg></span>
      <div class="wf-head__text">
        <h2 class="wf-head__title">Website Forms</h2>
        <p class="page-subtitle">Booking, quote and contact enquiries sent from the taqwa.autos website.</p>
      </div>
      <button type="button" class="btn btn--ghost wf-refresh" id="wfRefresh"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg><span>Refresh</span></button>
    </div>

    <div class="wf-chips" role="group" aria-label="Filter by status">
      <button type="button" class="wf-chip is-active" data-status="" aria-pressed="true">All <span class="wf-chip__n" data-count="total"></span></button>
      <button type="button" class="wf-chip" data-status="New" aria-pressed="false">New <span class="wf-chip__n" data-count="new"></span></button>
      <button type="button" class="wf-chip" data-status="Contacted" aria-pressed="false">Contacted <span class="wf-chip__n" data-count="contacted"></span></button>
      <button type="button" class="wf-chip" data-status="Confirmed" aria-pressed="false">Confirmed <span class="wf-chip__n" data-count="confirmed"></span></button>
      <button type="button" class="wf-chip" data-status="Rejected" aria-pressed="false">Rejected <span class="wf-chip__n" data-count="rejected"></span></button>
    </div>

    <div class="wf-toolbar" role="search" aria-label="Find enquiries">
      <label class="wf-search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="search" class="input" id="wfSearch" placeholder="Search name, phone, registration or message&#8230;" aria-label="Search by name, phone, registration number or message" maxlength="100" autocomplete="off">
      </label>
      <select class="select" id="wfType" aria-label="Filter by form">
        <option value="">All forms</option><option value="booking">Booking</option><option value="quote">Quote</option><option value="contact">Contact</option>
      </select>
      <label class="wf-date"><span>From</span><input type="date" class="input" id="wfFrom" aria-label="From date"></label>
      <label class="wf-date"><span>To</span><input type="date" class="input" id="wfTo" aria-label="To date"></label>
      <button type="button" class="btn btn--ghost btn--sm" id="wfClear" hidden>Clear filters</button>
    </div>

    <div class="wf-layout" id="wfLayout">
      <section class="card wf-col wf-col--list" aria-labelledby="wfListTitle">
        <h3 class="wf-sr" id="wfListTitle">Enquiries</h3>
        <div class="wf-state" id="wfListState" role="status" aria-live="polite"></div>
        <ul class="wf-list" id="wfList" aria-labelledby="wfListTitle" hidden></ul>
        <div class="wf-foot" id="wfFoot" hidden><span id="wfCount"></span><button type="button" class="btn btn--ghost btn--sm" id="wfMore" hidden>Load more</button></div>
      </section>

      <section class="card wf-col wf-col--detail" aria-label="Enquiry details">
        <div class="wf-state wf-state--center" id="wfDetailEmpty"><p>Choose an enquiry to see its details.</p></div>
        <div class="wf-detail" id="wfDetail" hidden>
          <header class="wf-detail__head">
            <button type="button" class="icon-btn wf-back" id="wfBack" aria-label="Back to enquiries"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
            <div class="wf-detail__who"><h3 id="wfdName"></h3><span id="wfdMeta"></span></div>
            <span class="wf-status" id="wfdStatusBadge"></span>
          </header>
          <dl class="wf-facts" id="wfdFacts"></dl>
          <div class="wf-message" id="wfdMessageWrap"><h4>Message</h4><p id="wfdMessage"></p></div>
          <form class="wf-manage" id="wfManage" novalidate>
            <div class="field">
              <label for="wfdStatus">Status</label>
              <select class="select" id="wfdStatus" name="status"><option>New</option><option>Contacted</option><option>Confirmed</option><option>Rejected</option></select>
            </div>
            <div class="field">
              <label for="wfdNotes">Internal notes</label>
              <textarea class="textarea" id="wfdNotes" name="notes" rows="4" maxlength="2000" placeholder="Visible to staff only"></textarea>
              <span class="field__error" data-err="manage"></span>
            </div>
            <button type="submit" class="btn btn--primary" id="wfdSave">Save</button>
          </form>
          <div class="wf-history"><h4>History</h4><ol id="wfdHistory"></ol></div>
        </div>
      </section>
    </div>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/seed-data.js"></script>
  <script src="../js/version.js"></script>
  <script src="../js/offline.js"></script>
  <script src="../js/sync.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/inbox-website-forms.js"></script>
  <span id="shell-drawn" hidden></span>
</body>
</html>
